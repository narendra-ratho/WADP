<!DOCTYPE html>
<html>
<head>
    <title>User Data</title>
</head>
<body>

    <h2>Registered User Data</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
            </tr>
        </thead>

        <tbody id="userdata"></tbody>
    </table>

    <script>
        let users = JSON.parse(localStorage.getItem("users")) || [];

        let tableData = "";

        users.forEach(function(user) {
            tableData += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.password}</td>
                </tr>
            `;
        });

        document.getElementById("userdata").innerHTML = tableData;
    </script>

</body>
</html>
